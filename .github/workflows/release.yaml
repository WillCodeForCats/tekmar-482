name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  release-zip:
    name: Attach release ZIP
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      # Marketplace and HACS extract this archive directly into
      # custom_components/tekmar_482, so the integration files must be at
      # the root of the ZIP, not inside a folder. git archive with tag:path
      # does that, and only includes files tracked at that tag.
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false

      - name: Create ZIP
        run: |
          git archive --format=zip -o tekmar_482.zip \
            "HEAD:custom_components/tekmar_482"

      - name: Upload ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${TAG_NAME}" tekmar_482.zip \
            --repo "${GITHUB_REPOSITORY}" --clobber
